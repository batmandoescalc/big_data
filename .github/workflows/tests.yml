# Runs the local test suites on every push and pull request to dev and main,
# so a reviewer can see a green or red check before reading the diff. The
# check's summary page shows a plain-English report of what was tested.
# No cluster access, credentials, or datasets are used.
name: Local tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 matches the RHEL 9 cluster, but GitHub's Ubuntu 26.04
        # image no longer provides it. Pin that compatibility job to 24.04;
        # retain ubuntu-latest for the current Python check.
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests and shell syntax checks
        run: bash scripts/run-tests.sh
